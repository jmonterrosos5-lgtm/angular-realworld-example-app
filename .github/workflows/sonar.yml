name: SonarQube Cloud

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-test-analyze:
    name: Build, pruebas y análisis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 16 (compatible con Angular 11)
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el proyecto
        run: npx ng build --prod

      - name: Ejecutar pruebas unitarias con cobertura
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI --code-coverage

      - name: Análisis con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
